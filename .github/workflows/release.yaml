name: release

on:
  pull_request:
    branches:
      - stable
    types:
      - closed

  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest

    outputs:
      ok: ${{ steps.check.outputs.ok }}

    steps:
      - name: Check trigger
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged || false }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
        run: |
          set -euo pipefail

          OK="false"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            OK="true"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_MERGED" = "true" ] &&
               [ "$PR_BASE_REF" = "stable" ] &&
               [[ "$PR_HEAD_REF" == release/* ]]; then
              OK="true"
            fi
          fi

          echo "ok=$OK" >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    if: ${{ needs.guard.outputs.ok == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stable commit
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Parse version from CHANGELOG.md
        id: version
        shell: bash
        run: |
          set -euo pipefail

          FILE="CHANGELOG.md"

          if [ ! -f "$FILE" ]; then
            echo "CHANGELOG.md not found" >&2
            exit 1
          fi

          VERSION="$(grep -m1 -E '^## \[v?[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' "$FILE" \
            | sed -E 's/^## \[v?([^]]+)\].*/\1/')"

          if [ -z "$VERSION" ]; then
            echo "Could not parse version from CHANGELOG.md" >&2
            echo "Expected heading like: ## [v0.1.0] - YYYY-MM-DD" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          IMAGE="ghcr.io/${{ github.repository }}"

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"

          echo "Parsed version: $VERSION"
          echo "Release tag: $TAG"
          echo "Image: $IMAGE"

      - name: Verify chart version matches release
        shell: bash
        run: |
          set -euo pipefail

          CHART_VERSION="$(grep -E '^version:' chart/Chart.yaml | awk '{print $2}' | tr -d '"')"
          APP_VERSION="$(grep -E '^appVersion:' chart/Chart.yaml | awk '{print $2}' | tr -d '"')"
          EXPECTED="${{ steps.version.outputs.version }}"

          if [ "$CHART_VERSION" != "$EXPECTED" ]; then
            echo "chart/Chart.yaml version is $CHART_VERSION, expected $EXPECTED"
            exit 1
          fi

          if [ "$APP_VERSION" != "$EXPECTED" ]; then
            echo "chart/Chart.yaml appVersion is $APP_VERSION, expected $EXPECTED"
            exit 1
          fi

          echo "Chart version and appVersion match $EXPECTED"

      - name: Check if tag already exists
        id: tagcheck
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist yet."
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repositories
        run: |
          helm repo add coder https://helm.coder.com/v2
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build chart

      - name: Lint Helm chart
        run: helm lint chart

      - name: Package Helm chart
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          helm package chart \
            --destination dist \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"

          ls -lah dist

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          IMAGE="${{ steps.version.outputs.image }}"
          FILE="CHANGELOG.md"
          BODY_FILE="/tmp/cyrostack_coder_release_body.md"

          NOTES="$(awk -v ver="## [${VERSION}]" -v ver2="## [v${VERSION}]" '
            $0 ~ "^## \\[" { in_section=0 }
            index($0, ver) == 1 || index($0, ver2) == 1 { in_section=1; next }
            in_section { print }
          ' "$FILE" | sed -e '1{/^$/d}')"

          if [ -z "$NOTES" ]; then
            echo "No changelog content found under version ${VERSION}" >&2
            exit 1
          fi

          printf "%s\n" "$NOTES" > "$BODY_FILE"

          cat >> "$BODY_FILE" <<EOF

          ---

          ## Distribution

          ### Container Image

          This release is published to GitHub Container Registry:

          - \`${IMAGE}:${TAG}\`
          - \`${IMAGE}:latest\`

          Pull with:

          \`\`\`bash
          docker pull ${IMAGE}:${TAG}
          \`\`\`

          ### Helm Chart

          The Helm chart package is attached to this GitHub Release:

          - \`cyrostack-coder-${VERSION}.tgz\`
          EOF

          echo "body_path=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        if: steps.tagcheck.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./image
          file: ./image/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check if GitHub Release exists
        id: releasecheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Release $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Release $TAG does not exist yet."
          fi

      - name: Create GitHub Release
        if: steps.releasecheck.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: false
          prerelease: false
          files: |
            dist/*.tgz
