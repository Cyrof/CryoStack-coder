name: Lint

on:
  push:
    branches-ignore:
      - "release/**"

  pull_request:
    branches-ignore:
      - "release/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: YAML
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Lint YAML
        run: yamllint .

  github-actions:
    name: GitHub Actions
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest /usr/local/bin

      - name: Lint workflow files
        run: actionlint

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build chart dependencies
        run: helm dependency build chart

      - name: Lint chart
        run: helm lint chart

      - name: Render chart
        run: |
          helm template cyrostack-coder chart \
            --namespace coder \
            --values chart/values.yaml

  terraform:
    name: Terraform templates
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive templates

      - name: Validate Coder templates
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d templates ]; then
            echo "No templates directory found, skipping."
            exit 0
          fi

          for dir in templates/*; do
            if [ -d "$dir" ] && [ -f "$dir/main.tf" ]; then
              echo "Validating $dir"
              terraform -chdir="$dir" init -backend=false
              terraform -chdir="$dir" validate
            fi
          done

  dockerfile:
    name: Dockerfile
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: image/Dockerfile
          failure-threshold: warning

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t scripts < <(
            find . \
              -type f \
              \( -name "*.sh" -o -path "./image/scripts/*" -o -path "./scripts/*" \) \
              -not -path "./.git/*"
          )

          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found, skipping."
            exit 0
          fi

          shellcheck "${scripts[@]}"

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release/') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            !.git/**
