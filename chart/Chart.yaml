apiVersion: v2
name: cyrostack-coder
description: CyroStack Coder platform Helm chart
type: application
version: 1.0.2
appVersion: "1.0.2"

dependencies:
  - name: coder
    version: "2.34.3"
    repository: https://helm.coder.com/v2
    condition: coder.enabled

  - name: postgresql
    version: ">=16.0.0 <17.0.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
